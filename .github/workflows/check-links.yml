# Re-checks every official source link once a week and stores the result in
# data/link-status.json, which the site displays as "link checked on …".
# Note: some Indian government sites block requests from outside India or from
# automated clients; those will show a non-200 status here even if they work
# in a browser. That is a limitation of the check, not necessarily a dead link.
name: Check official source links
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: bash scripts/check_links.sh
      - name: Commit result
        id: commit
        run: |
          git config user.name "link-checker[bot]"
          git config user.email "link-checker@users.noreply.github.com"
          git add data/link-status.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore: weekly link status update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy site with the new link status
        if: steps.commit.outputs.changed == 'true'
        # Pushes made with GITHUB_TOKEN do not start other workflows, so start the deploy explicitly.
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
